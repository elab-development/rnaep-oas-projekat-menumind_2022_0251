services:
  # frontend
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: menumind-frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_started

  # api gateway
  api-gateway:
    build: ./services/api-gateway
    container_name: menumind-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      AUTH_SERVICE_URL: http://auth-service:4001
      MENU_SERVICE_URL: http://menu-service:4002
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:4003
      ANALYTICS_SERVICE_URL: http://analytics-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
      MEDIA_SERVICE_URL: http://media-service:4006
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - auth-service
      - menu-service
      - recommendation-service
      - analytics-service
      - notification-service
      - media-service

  # auth service
  auth-service:
    build: ./services/auth-service
    container_name: menumind-auth-service
    environment:
      PORT: 4001
      DATABASE_URL: postgres://auth:auth@auth-db:5432/menumind_auth
      BETTER_AUTH_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-secret-change-me}
      TRUSTED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000},${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      KAFKA_BROKERS: kafka:9092
      SEED_SYSTEM_ADMIN_EMAIL: ${SEED_SYSTEM_ADMIN_EMAIL:-admin@menumind.local}
      SEED_SYSTEM_ADMIN_PASSWORD: ${SEED_SYSTEM_ADMIN_PASSWORD:-admin12345}
      SEED_RESTAURANT_ADMIN_EMAIL: ${SEED_RESTAURANT_ADMIN_EMAIL:-demo@menumind.local}
      SEED_RESTAURANT_ADMIN_PASSWORD: ${SEED_RESTAURANT_ADMIN_PASSWORD:-demo12345}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4001/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  auth-db:
    image: postgres:17
    container_name: menumind-auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: menumind_auth
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
      - ./services/auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d menumind_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #  menu service
  menu-service:
    build: ./services/menu-service
    container_name: menumind-menu-service
    environment:
      PORT: 4002
      DATABASE_URL: postgres://menu:menu@menu-db:5432/menumind_menu
      AUTH_SERVICE_URL: http://auth-service:4001
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4002/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      menu-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  menu-db:
    image: postgres:17
    container_name: menumind-menu-db
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
      POSTGRES_DB: menumind_menu
    volumes:
      - menu_pgdata:/var/lib/postgresql/data
      - ./services/menu-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menumind_menu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # recommendation service
  recommendation-service:
    build: ./services/recommendation-service
    container_name: menumind-recommendation-service
    environment:
      PORT: 4003
      MONGODB_URI: mongodb://recommendation-mongo:27017/menumind_recommendations
      AUTH_SERVICE_URL: http://auth-service:4001
      KAFKA_BROKERS: kafka:9092
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4003/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      recommendation-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  recommendation-mongo:
    image: mongo:7
    container_name: menumind-recommendation-mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_DATABASE: menumind_recommendations
    volumes:
      - recommendation_mongodata:/data/db
      - ./services/recommendation-service/db/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # analytics service
  analytics-service:
    build: ./services/analytics-service
    container_name: menumind-analytics-service
    environment:
      PORT: 4004
      MONGODB_URI: mongodb://analytics-mongo:27017/menumind_analytics
      AUTH_SERVICE_URL: http://auth-service:4001
      KAFKA_BROKERS: kafka:9092
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://open.er-api.com/v6/latest/EUR}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4004/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      analytics-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-mongo:
    image: mongo:7
    container_name: menumind-analytics-mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_DATABASE: menumind_analytics
    volumes:
      - analytics_mongodata:/data/db
      - ./services/analytics-service/db/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # notification service
  notification-service:
    build: ./services/notification-service
    container_name: menumind-notification-service
    environment:
      PORT: 4005
      MONGODB_URI: mongodb://notification-mongo:27017/menumind_notifications
      AUTH_SERVICE_URL: http://auth-service:4001
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4005/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      notification-mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-mongo:
    image: mongo:7
    container_name: menumind-notification-mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_DATABASE: menumind_notifications
    volumes:
      - notification_mongodata:/data/db
      - ./services/notification-service/db/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # media service
  media-service:
    build: ./services/media-service
    container_name: menumind-media-service
    environment:
      PORT: 4006
      AUTH_SERVICE_URL: http://auth-service:4001
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4006/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - auth-service

  # kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: menumind-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: menumind-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy

  # monitoring
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: menumind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.4.0
    container_name: menumind-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: menumind-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg

volumes:
  auth_pgdata:
  menu_pgdata:
  recommendation_mongodata:
  analytics_mongodata:
  notification_mongodata:
  prometheus_data:
  grafana_data:
